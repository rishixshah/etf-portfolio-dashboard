name: ETF Portfolio Tracker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 1-5'

jobs:
  run-etf-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit yfinance pandas matplotlib

      - name: Execute ETF Script
        run: python ETF_Portfolio.py

      - name: Commit & Push ETF Output Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add etf_summary.txt latest_etf_chart.png
          git commit -m "Auto-update ETF summary and chart [skip ci]" || exit 0
          git push origin main
